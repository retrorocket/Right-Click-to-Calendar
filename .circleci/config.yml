version: 2.1
jobs:
  build:
    working_directory: ~/workspace # ステップが実行されるディレクトリ
    docker: # Dockerでステップを実行
      - image: cimg/node:26.3.0
    steps:
      - checkout
      - restore_cache:
          name: Restore pnpm Package Cache
          keys:
            - pnpm-packages-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install pnpm package manager
          command: |
            npm install --global corepack@latest
            sudo corepack enable
            sudo corepack prepare pnpm@latest-11 --activate
            pnpm config set store-dir .pnpm-store
      - run:
          name: Install Dependencies
          command: |
            pnpm install
      - save_cache:
          name: Save pnpm Package Cache
          key: pnpm-packages-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - .pnpm-store
      - persist_to_workspace:
          root: .
          paths:
            - .

  test:
    docker: # Dockerでステップを実行
      - image: cimg/node:26.3.0
    steps:
      # 共有したworkspaceをアタッチする
      - attach_workspace:
          at: .
      - run:
          name: Jestによるテストの実行
          command: pnpm test -i --ci --runInBand
      - store_artifacts:
          path: coverage
      - store_artifacts:
          path: reports
      - store_test_results:
          path: reports

  lint:
    docker: # Dockerでステップを実行
      - image: cimg/node:26.3.0
    steps:
      # 共有したworkspaceをアタッチする
      - attach_workspace:
          at: .
      - run:
          name: ESLintの実行
          command: pnpm run lint . --format junit --output-file reports/eslint/results.xml
      - store_artifacts:
          path: reports
      - store_test_results:
          path: reports

  create_zip:
    docker: # Dockerでステップを実行
      - image: cimg/node:26.3.0
    steps:
      # 共有したworkspaceをアタッチする
      - attach_workspace:
          at: .
      # 設定した秘密鍵のFingerPrintを追記する
      - add_ssh_keys:
          fingerprints:
            - "c1:ad:bc:ef:41:5e:95:c9:fb:6a:00:fb:58:26:23:ac"
      - run: sudo apt update
      - run: sudo apt install -y rsync
      - run: ssh-keyscan -p ${PORT} ${HOST_NAME} >> ~/.ssh/known_hosts
      - run: rsync -e "ssh -p ${PORT}" -avz ${USER}@${HOST_NAME}:/home/${USER}/public/icons ./app/
      - run: cd ./app && zip -r release ./*
      - store_artifacts:
          path: ./app/release.zip

workflows:
  version: 2
  publish: # workflow名
    jobs:
      - build
      - test:
          requires: # buildが成功したら
            - build
      - lint:
          requires:
            - build
      - create_zip:
          requires:
            - test
            - lint
          filters:
            branches: # 指定ブランチでのみ実行する
              only:
                - main
